[project]
name = "alexandria"
version = "0.1.0"
description = "A static site generator for a densely interlinked, gwern.net-style blog."
requires-python = ">=3.11"
dependencies = [
    "Markdown>=3.6",
    "Pygments>=2.17",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
]

[tool.setuptools.packages.find]
include = ["alexandria*"]
