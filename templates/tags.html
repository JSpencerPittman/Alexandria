{% extends "base.html" %}
{% block title %}Tags — {{ site.title }}{% endblock %}
{% block content %}
<article class="listing">
  <h1>Tags</h1>
  <ul class="tag-list">
    {% for tag, count in tags|dictsort %}
    <li><a href="/tags/{{ tag|slugify }}/">{{ tag }}</a> <span class="count">{{ count }}</span></li>
    {% endfor %}
  </ul>
</article>
{% endblock %}
